[package]
name = "yu-backend-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
wgpu = "30.0.1"
yu-backend-soft = { path = "../soft" }
yu-font = { path = "../../yu-font" }
yu-gfx = { path = "../../yu-gfx" }
yu-log = { path = "../../yu-log" }

[dev-dependencies]
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
yu-format = { path = "../../yu-format" }
yu-rt = { path = "../../yu-rt" }
yu-vfs = { path = "../../yu-vfs" }

[[example]]
name = "wgpu_first_frame"
path = "examples/wgpu_first_frame.rs"

[[example]]
name = "wgpu_frame_walk"
path = "examples/wgpu_frame_walk.rs"

[lib]
name = "yu_backend_wgpu"
path = "src/lib.rs"
