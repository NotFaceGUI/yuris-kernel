[package]
name = "yu-host-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser presenter for yuris-kernel (WebGPU present with Canvas2D fallback)"

[lib]
crate-type = ["cdylib", "rlib"]
name = "yu_host_wasm"
path = "src/lib.rs"

[dependencies]
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData",
] }
