[package]
name = "yu-host-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android host: NDK cdylib + JNI entry, engine on a real filesystem, RGBA frames to Java"

[lib]
name = "yu_host_android"
path = "src/lib.rs"
# cdylib = JNI 入口(libyu_host_android.so);rlib 供宿主的 Rust 侧测试/示例链接。
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
# 音频输出:Android 上 cpal 走 oboe。
cpal = "0.15"
log = "0.4"
yu-engine = { path = "../../yu-engine" }
yu-backend-wgpu = { path = "../../yu-render/wgpu" }
yu-render-core = { path = "../../yu-render/core" }
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
yu-font = { path = "../../yu-font" }
yu-log = { path = "../../yu-log" }
yu-rt = { path = "../../yu-rt" }
yu-save = { path = "../../yu-save" }
yu-sound = { path = "../../yu-sound" }

[target.'cfg(target_os = "android")'.dependencies]
# 全局分配器:Android so 内的 Rust 分配走 mimalloc(JVM/Java 堆不受影响)。
# `local_dynamic_tls` 是 Android(minSdk 24)的 TLS 模型要求。
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
# logcat 由 `src/logging.rs` 直接调 `__android_log_write`(单一日志器双写
# logcat + 文件);不再需要 `android_logger` 这个全局 logger 后端。
# 零拷贝上屏:ANativeWindow_fromSurface 把 Java Surface 转成原生窗口,
# 交给 wgpu 建 surface 直接呈现(跳过 GPU→CPU 读回)。
ndk-sys = "0.6"
# 手工构造 RawWindowHandle::AndroidNdk 交给 wgpu 建 surface。
raw-window-handle = "0.6"
# oboe(cpal 的 Android 音频后端)需要 JavaVM + Context。
ndk-context = "0.1"
