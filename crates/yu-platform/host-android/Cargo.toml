[package]
name = "yu-host-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android host: NDK cdylib + JNI entry, engine on a real filesystem, RGBA frames to Java"

[lib]
name = "yu_host_android"
path = "src/lib.rs"
# cdylib = JNI 入口(libyu_host_android.so);rlib 供宿主的 Rust 侧测试/示例链接。
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
# 音频输出:Android 上 cpal 走 oboe。
cpal = "0.15"
log = "0.4"
yu-engine = { path = "../../yu-engine" }
yu-backend-wgpu = { path = "../../yu-render/wgpu" }
yu-render-core = { path = "../../yu-render/core" }
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
yu-font = { path = "../../yu-font" }
yu-log = { path = "../../yu-log" }
yu-rt = { path = "../../yu-rt" }
yu-save = { path = "../../yu-save" }
yu-sound = { path = "../../yu-sound" }

[target.'cfg(target_os = "android")'.dependencies]
# logcat 后端(需 JavaVM/Context 已由 Java 侧交给 ndk-context)。
android_logger = "0.11"
# 零拷贝上屏:ANativeWindow_fromSurface 把 Java Surface 转成原生窗口,
# 交给 wgpu 建 surface 直接呈现(跳过 GPU→CPU 读回)。
ndk-sys = "0.6"
# 手工构造 RawWindowHandle::AndroidNdk 交给 wgpu 建 surface。
raw-window-handle = "0.6"
# oboe(cpal 的 Android 音频后端)需要 JavaVM + Context。
ndk-context = "0.1"
