[package]
name = "yu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop entry (headless + --mode desktop) + local service + case runner"

[lib]
name = "yu_cli"
path = "src/lib.rs"

[[bin]]
name = "yu-cli"
path = "src/main.rs"

# HMR 监督进程用的引擎子进程(只暴露 serve;原名 yu-engine,2026-10-25
# 让位给引擎装配 crate 后更名 yu-serve)。
# 单独 bin 的原因:Windows 上正在运行的 exe 不能被覆盖;监督进程必须
# 与它反复重建的子进程分开,否则 `cargo build` 永远写不进 yu-cli.exe。
[[bin]]
name = "yu-serve"
path = "src/engine_main.rs"

[features]
# 桌面窗口模式(`yu-cli run --mode desktop`)默认可用;纯 headless/CI
# 构建用 `--no-default-features`(不依赖声卡,不链 winit/egui)。
default = ["desktop"]
desktop = ["dep:yu-host-desktop"]

[dependencies]
log = "0.4"
# `@_TIME` 的宿主本地时间注入(DIV-RT-009);只用到 `now_local`。
time = { version = "0.3", features = ["local-offset"] }
wgpu = "30.0.1"
yu-backend-soft = { path = "../yu-render/soft" }
yu-render-core = { path = "../yu-render/core" }
yu-backend-wgpu = { path = "../yu-render/wgpu" }
yu-engine = { path = "../yu-engine" }
yu-gfx = { path = "../yu-gfx" }
yu-host-desktop = { path = "../yu-platform/host-desktop", optional = true }
yu-log = { path = "../yu-log" }
yu-platform-input = { path = "../yu-platform/input" }
yu-rt = { path = "../yu-rt" }
yu-save = { path = "../yu-save" }
yu-sound = { path = "../yu-sound" }
yu-vfs = { path = "../yu-vfs" }

[dev-dependencies]
# 仅 examples 使用:yu-trace 仍是旁挂(不进入 yu-cli 运行期依赖)。
yu-trace = { path = "../yu-trace" }
# 设置读写闭环测试(`tests/settings_persist.rs`)要拆/拼 gsd.sd 块。
yu-format = { path = "../yu-format" }
