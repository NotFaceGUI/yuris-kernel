[package]
name = "yu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native engine host + local service + wasm presenter bridge + case runner"

[lib]
name = "yu_cli"
path = "src/lib.rs"

[[bin]]
name = "yu-cli"
path = "src/main.rs"

# HMR 监督进程用的引擎子进程(只暴露 serve)。
# 单独 bin 的原因:Windows 上正在运行的 exe 不能被覆盖;监督进程必须
# 与它反复重建的子进程分开,否则 `cargo build` 永远写不进 yu-cli.exe。
[[bin]]
name = "yu-engine"
path = "src/engine_main.rs"

[features]
# 设备输出默认开启：正常 `yu-cli run/serve` 直接出声。
# headless/纯 golden 构建用 `--no-default-features` 关闭（不依赖声卡）。
default = ["device"]
# 把 `SoundState::render` 的 PCM 推给默认输出设备；不反哺状态机。
device = ["dep:cpal"]

[dependencies]
cpal = { version = "0.15", optional = true }
sha1 = "0.10"
sha2 = "0.10"
wgpu = "30.0.1"
yu-backend-soft = { path = "../yu-render/soft" }
yu-backend-wgpu = { path = "../yu-render/wgpu" }
yu-gfx = { path = "../yu-gfx" }
yu-log = { path = "../yu-log" }
yu-rt = { path = "../yu-rt" }
yu-sound = { path = "../yu-sound" }
yu-vfs = { path = "../yu-vfs" }
