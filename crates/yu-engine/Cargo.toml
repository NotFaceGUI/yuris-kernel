[package]
name = "yu-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine assembly shared by all hosts (boot/tick/restart) + host-common utils"

[lib]
name = "yu_engine"
path = "src/lib.rs"

[dependencies]
log = "0.4"
sha1 = "0.10"
sha2 = "0.10"
wgpu = "30.0.1"
yu-backend-soft = { path = "../yu-render/soft" }
yu-render-core = { path = "../yu-render/core" }
yu-backend-wgpu = { path = "../yu-render/wgpu" }
yu-font = { path = "../yu-font" }
yu-format = { path = "../yu-format" }
yu-gfx = { path = "../yu-gfx" }
yu-movie-plmpeg = { path = "../yu-platform/movie-plmpeg" }
yu-log = { path = "../yu-log" }
yu-rt = { path = "../yu-rt" }
yu-save = { path = "../yu-save" }
yu-sound = { path = "../yu-sound" }
yu-vfs = { path = "../yu-vfs" }

# `host_clock::local_now` 读本地时区(`@_TIME` 注入)。桌面与 Android 共用;
# wasm 没有进程级本地时区,不链它(见 host_clock 模块文档)。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
time = { version = "0.3", features = ["local-offset"] }
