[package]
name = "yu-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine assembly shared by all hosts (boot/tick/restart) + host-common utils"

[lib]
name = "yu_engine"
path = "src/lib.rs"

[dependencies]
log = "0.4"
sha1 = "0.10"
sha2 = "0.10"
wgpu = "30.0.1"
yu-backend-soft = { path = "../yu-render/soft" }
yu-render-core = { path = "../yu-render/core" }
yu-backend-wgpu = { path = "../yu-render/wgpu" }
yu-gfx = { path = "../yu-gfx" }
yu-log = { path = "../yu-log" }
yu-rt = { path = "../yu-rt" }
yu-save = { path = "../yu-save" }
yu-sound = { path = "../yu-sound" }
yu-vfs = { path = "../yu-vfs" }
