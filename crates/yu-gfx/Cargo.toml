[package]
name = "yu-gfx"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yu-log = { path = "../yu-log" }
yu-rt = { path = "../yu-rt" }
yu-format = { path = "../yu-format" }
# 热路径集合/映射:prune 循环每帧反复建 `BTreeSet<CopyId>`(每个节点一次
# 堆分配),`CGEND` 单次分配数直接由它决定。
rustc-hash = "2"

[dev-dependencies]
yu-vfs = { path = "../yu-vfs" }

[lib]
name = "yu_gfx"
path = "src/lib.rs"
