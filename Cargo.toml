[workspace]
resolver = "2"
exclude = ["third_party/swash"]
members = [
    "crates/yu-cli",
    "crates/yu-engine",
    "crates/yu-font",
    "crates/yu-format",
    "crates/yu-gfx",
    "crates/yu-log",
    "crates/yu-rt",
    "crates/yu-sound",
    "crates/yu-save",
    "crates/yu-trace",
    "crates/yu-vfs",
    "crates/yu-platform/host-desktop",
    "crates/yu-platform/host-wasm",
    "crates/yu-platform/host-android",
    "crates/yu-platform/movie-plmpeg",
    "crates/yu-platform/input",
    "crates/yu-render/core",
    "crates/yu-render/soft",
    "crates/yu-render/wgpu",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
flate2 = "1"

# 本地 fork:修复 `Outline::embolden` 在「就」这类多轮廓字形上把 coverage
# 算坏的问题(上游 0.2.10 未修)。只改 third_party/swash 内的算法,不改 API。
[patch.crates-io]
swash = { path = "third_party/swash" }

# 本机 MSVC 环境下 libz-sys 的 vendored zlib 在 dev/test 档带 `-Z7` 编译时
# 触发 cl D8050(无法执行 c1.dll:未能将命令行放入调试记录中);该包是
# 纯 C 依赖,调试信息无价值。release 档默认 debug=false,不受影响。
[profile.dev.package.libz-sys]
debug = false

[profile.test.package.libz-sys]
debug = false

# mimalloc 的 C 静态库同理:dev/test 档带 `-Z7` 会触发同一个 cl D8050
# (c1xx.dll 命令行调试记录溢出);它是纯 C 分配器,调试信息无价值。
[profile.dev.package.libmimalloc-sys]
debug = false

[profile.test.package.libmimalloc-sys]
debug = false

# 图像解码同理:zune-jpeg 是纯计算密集的第三方实现,dev 档未优化时单帧
# 400×300 解码要 ~27 ms,release 只要 0.6 ms(B14 实测,45×)。影片播放每换
# 一帧都解两张 JPEG,dev 档会把 60 fps 直接打到 30 fps —— 与实现无关,只是
# 构建档位。这里只给解码器提优化级别,本仓库代码仍按 dev 档调试。
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.test.package.zune-jpeg]
opt-level = 3

[profile.test.package.image]
opt-level = 3

# 发布档优化(跨平台通用,不绑定 CPU 指令集):
# - fat LTO:跨 crate 内联/常量传播,消除引擎/渲染/字体之间的调用边界;
# - codegen-units = 1:本 crate 单编译单元,LLVM 能做更激进的优化。
# 代价是 release 构建明显变慢;dev/test 档不受影响。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
