# JDK 21(Android Studio 自带 JBR):AGP 8.13 要求 17+。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
org.gradle.parallel=true

# 本机 SDK(不入库;首次构建可被 ANDROID_HOME 覆盖)
# sdk.dir 由 local.properties 或 ANDROID_HOME 提供

# 离线构建:AGP 默认要从 Maven 拉 aapt2 制品;SDK 里已有同版本二进制可直接复用。
# 这里**不写死绝对路径**(那是机器相关的,CI 上必然失效):tools/android/build.sh
# 会自动探测 $ANDROID_HOME/build-tools/*/aapt2 并传 -Pandroid.aapt2FromMavenOverride。
# 手工调用 gradle 且要离线复用时,自己补同一个 -P 参数即可;联网构建不需要。

# 注意:本机 7897 代理对 Gradle/curl 的 CONNECT 隧道不通(握手被中断),
# 依赖改由 settings.gradle.kts 里的腾讯云镜像获取,不要在这里配代理。
