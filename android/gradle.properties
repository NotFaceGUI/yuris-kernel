# JDK 21(Android Studio 自带 JBR):AGP 8.13 要求 17+。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
org.gradle.parallel=true

# 本机 SDK(不入库;首次构建可被 ANDROID_HOME 覆盖)
# sdk.dir 由 local.properties 或 ANDROID_HOME 提供

# 离线构建:AGP 默认要从 Maven 拉 aapt2 制品;SDK 里已有同版本二进制,
# 直接指定,避免联网(与 build-tools 版本对齐)。
android.aapt2FromMavenOverride=E:/Software/Android/build-tools/36.1.0/aapt2.exe

# 注意:本机 7897 代理对 Gradle/curl 的 CONNECT 隧道不通(握手被中断),
# 依赖改由 settings.gradle.kts 里的腾讯云镜像获取,不要在这里配代理。
